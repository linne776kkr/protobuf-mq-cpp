syntax = "proto3";
package mq;

import "msg.proto";

//信道的打开与关闭
message openChannelRequst{
    string rid = 1;//请求id
    string cid = 2;//信道id
};
message cloceChannelRequst{
    string rid = 1;
    string cid = 2;
};
//交换机的声明与删除
message declareExchangeRequest{
    string rid = 1;
    string cid = 2;
    string exchange_name = 3;//交换机名称
    ExchangeType exchange_type = 4;//交换机类型
    DeliveryMode durable = 5;//持久化标志
    bool auto_delete = 6;//自动删除标志
    map<string,string> args = 7;//其他参数
};
message deleteExchangeRequst{
    string rid = 1;
    string cid = 2;
    string exchange_name = 3;
};
//队列的声明与删除
message declareQueueRequst{
    string rid = 1;
    string cid = 2;
    string queue_name = 3;//队列名称
    bool durable = 4;//持久化标志
    bool exclusive = 5;//独占标志
    bool auto_delete = 6;//自动删除标志
    map<string,string> args = 7;//其他参数
};
message deleteQueueRequest{
    string rid = 1;
    string cid = 2;
    string queue_name = 3;
};
//绑定与解除绑定
message queueBindRequest{
    string rid = 1;
    string cid = 2;
    string exchange_name = 3;//交换机名称
    string queue_name = 4;//队列名称
    string binding_key = 5;//匹配关键词
};
message queueUnbindRequest{
    string rid = 1;
    string cid = 2;
    string exchange_name = 3;
    string queue_name = 4;
};
//消息的发布与确认
message basicPublishRequest{
    string rid = 1;
    string cid = 2;
    string exchange_name = 3;//消息发布到交换机
    BasecProperties properties = 4;//消息的属性
    string body = 5;//消息的主体
};
message basicAckRequest{
    string rid = 1;
    string cid = 2;
    string queue_name = 3;
    string message_id = 4;
};
//队列的订阅与取消
message basicConsumeRequest{
    string rid = 1;
    string cid = 2;
    string consumer_tag = 3;//消费者标识
    string queue_name = 4;//订阅的队列名称
    bool auto_ack = 5;//自动应答标识
};
message basicCancelRequest{
    string rid = 1;
    string cid = 2;
    string consumer_tag = 3;
    string queue_name = 4;
};
//消息推送给客户端
message basicConsumeResponse{
    string cid = 1;
    string consumer_tag = 2;//消费者标识
    BasecProperties properties = 3;//信息的属性
    string body = 4;//消息的主体
};
//服务器对客户端的响应
message basicCommonResponse{
    string rid = 1;
    string cid = 2;
    bool ok = 3;//服务是否成功执行
};